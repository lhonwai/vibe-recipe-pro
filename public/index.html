<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Recipe Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🍳 Smart Recipe Finder</h1>
      <p>Discover delicious recipes based on your ingredients</p>
    </header>

    <div class="search-section">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Enter ingredients (e.g., pasta, chicken, tomato)..."
        autocomplete="off"
      >
      <button id="searchBtn">Search Recipes</button>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Searching for recipes...</p>
    </div>

    <div id="errorMessage" class="error-message hidden"></div>

    <div id="results" class="results"></div>
  </div>

  <script src="recipe.js"></script>
</body>
</html>
